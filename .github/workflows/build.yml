name: Build and test

# Runs on pull requests and again on main after each merge, so code merged
# before its checks finished still gets built and tested.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 27 (iOS 27 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $sdk"
          case "$sdk" in 27.*) ;; *) echo "::error::Expected the iOS 27 SDK, got $sdk"; exit 1;; esac
      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, items in sorted(devices.items(), reverse=True) if 'iOS' in runtime for d in items if 'iPhone' in d['name']))")
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      - name: Build
        run: |
          xcodebuild build-for-testing -quiet \
            -project WaterTracker.xcodeproj -scheme WaterTracker \
            -destination "platform=iOS Simulator,id=$SIMULATOR"
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project WaterTracker.xcodeproj -scheme WaterTracker \
            -destination "platform=iOS Simulator,id=$SIMULATOR" | tail -n 80
